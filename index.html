<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<meta name="robots" content="noindex, nofollow" />
<title>Giraffa Consulting — Stiamo costruendo qualcosa di nuovo</title>
<meta name="description" content="Il nuovo sito di Giraffa Consulting è in arrivo. Consulenza creativa, brand e comunicazione a Verona. Scrivici a ciao@giraffaconsulting.it." />
<meta name="theme-color" content="#faf6ef" />
<meta property="og:title" content="Giraffa Consulting — In arrivo" />
<meta property="og:description" content="Stiamo costruendo qualcosa di nuovo. Nel frattempo, scrivici." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css" />
<style>
  body{ overflow:hidden; }
  .cs{ position:relative; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:clamp(28px,6vw,80px); }
  .cs__glow{ position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(60% 50% at 50% 38%, rgba(210,85,46,.10), transparent 70%); }
  .cs__inner{ position:relative; z-index:1; max-width:760px; }
  .cs__logo{ width:clamp(96px,16vw,150px); height:auto; margin:0 auto clamp(26px,4vw,40px); animation:csIn .9s var(--ease-out) both; }
  .cs__pill{ display:inline-flex; align-items:center; gap:.6em; font-family:var(--ff-body); font-weight:600; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--terra-deep);
    background:rgba(210,85,46,.10); border:1px solid rgba(210,85,46,.22); padding:.5em 1em; border-radius:100px; animation:csIn .9s .05s var(--ease-out) both; }
  .cs__pill i{ width:7px; height:7px; border-radius:50%; background:var(--terra); display:inline-block; animation:csPulse 1.8s ease-in-out infinite; }
  .cs__h{ font-family:var(--ff-display); font-weight:400; font-size:clamp(2.4rem,7vw,5rem); line-height:1.02; letter-spacing:-.02em; color:var(--ink); margin:clamp(20px,3vw,30px) 0 0; animation:csIn 1s .12s var(--ease-out) both; }
  .cs__h em{ font-style:italic; color:var(--terra); }
  .cs__sub{ font-family:var(--ff-body); font-size:clamp(1rem,1.5vw,1.18rem); line-height:1.6; color:var(--txt-soft); max-width:46ch; margin:clamp(18px,2.4vw,26px) auto 0; animation:csIn 1s .2s var(--ease-out) both; }
  .cs__cta{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:clamp(26px,3.4vw,38px); animation:csIn 1s .28s var(--ease-out) both; }
  .cs__foot{ position:absolute; bottom:clamp(18px,3vw,30px); left:0; right:0; z-index:1; font-family:var(--ff-body); font-size:.78rem; color:var(--txt-soft); letter-spacing:.02em; }
  @keyframes csIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  @keyframes csPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.5); opacity:.5; } }
  @media(prefers-reduced-motion:reduce){ .cs__logo,.cs__pill,.cs__h,.cs__sub,.cs__cta{ animation:none; } .cs__pill i{ animation:none; } }
</style>
</head>
<body>
<div class="grain"></div>

<main class="cs">
  <span class="cs__glow" aria-hidden="true"></span>
  <div class="cs__inner">
    <img class="cs__logo" src="/logo-vertical.png" alt="Giraffa Consulting" />
    <span class="cs__pill"><i></i> Sito in costruzione</span>
    <h1 class="cs__h">Stiamo costruendo<br>qualcosa di <em>nuovo</em>.</h1>
    <p class="cs__sub">Il nuovo sito di Giraffa Consulting è in arrivo. Nel frattempo siamo qui: scrivici, rispondiamo sempre.</p>
    <div class="cs__cta">
      <a class="btn btn-primary" href="mailto:ciao@giraffaconsulting.it?subject=Ciao%20Giraffa">Scrivici <span class="arr">→</span></a>
      <a class="btn btn-ghost" href="https://www.instagram.com/giraffa.consulting/" target="_blank" rel="noopener">@giraffa.consulting</a>
    </div>
  </div>
  <div class="cs__foot">© 2026 Giraffa Consulting di Ugrcic Nicola · Verona</div>
</main>

</body>
</html>
